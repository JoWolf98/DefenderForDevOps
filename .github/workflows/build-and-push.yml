name: Build and Push to ACR

on:
  push:
    branches:
      - main
    paths:
      - 'defender-container-test/**'
      - '.github/workflows/build-and-push.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: acrforcontainerdemo.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Build and push image
        run: |
          docker build -t acrforcontainerdemo.azurecr.io/defender-container-test:${{ github.sha }} ./defender-container-test
          docker push acrforcontainerdemo.azurecr.io/defender-container-test:${{ github.sha }}
